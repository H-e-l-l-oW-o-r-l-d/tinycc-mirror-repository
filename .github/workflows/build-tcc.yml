name: Build TinyCC

on:
  push:
    branches: [ mob ]
  pull_request:
    branches: [ mob ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup MSYS2 environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-gcc
            make

      - name: Configure TCC (MinGW)
        run: ./configure --config-mingw32 --enable-static

      - name: Build TCC
        run: make -j4

      # - name: Run tests (optional)
      #   run: make test

      # 更新此步骤以包含 lib 目录
      - name: Upload TCC artifact (incl. libs)
        uses: actions/upload-artifact@v4
        with:
          name: tcc-windows-amd64-with-libs # 可以稍微修改名字以示区别
          path: |                            # 使用多行指定多个路径
            ./tcc.exe
            ./lib                           # 直接指定 lib 目录，会包含其下所有内容
          if-no-files-found: error
