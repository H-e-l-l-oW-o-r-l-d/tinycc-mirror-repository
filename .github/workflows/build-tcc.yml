name: Build TinyCC

# 触发工作流程的事件
on:
  push:
    branches: [ mob ] # 当代码被推送到 mob 分支时触发
  pull_request:
    branches: [ mob ] # 当有 Pull Request 指向 mob 分支时触发
  workflow_dispatch: # 允许手动从 Actions 选项卡触发

jobs:
  build-windows: # 定义一个名为 build-windows 的 Job
    runs-on: windows-latest # 指定运行该 Job 的虚拟机环境 (最新的 Windows Server)

    # 设置默认 Shell 为 MSYS2 bash，后续 run 命令会在此 shell 中执行
    defaults:
      run:
        shell: msys2 {0}

    steps:
      # 第 1 步：检出代码
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 第 2 步：设置 MSYS2 环境
      # 使用 msys2/setup-msys2 action 来安装和配置 MSYS2
      - name: Setup MSYS2 environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64   # 指定使用 MINGW64 子系统 (适用于 64 位 Windows 编译)
          update: true       # 更新 MSYS2 基础包
          install: >        # 安装编译所需的包
            mingw-w64-x86_64-gcc
            make

      # 第 3 步：配置 TCC for MinGW
      # 运行 configure 脚本，并传入 Windows 特定参数
      - name: Configure TCC (MinGW)
        run: ./configure --config-mingw32 --enable-static

      # 第 4 步：编译 TCC
      # 使用 make -j4 进行并行编译
      - name: Build TCC
        run: make -j4

      # 第 5 步 (可选)：运行测试
      # 注意：测试在 Windows/MSYS2 环境下可能需要额外配置或可能不完全通过
      # - name: Run tests (optional)
      #   run: make test

      # 第 6 步：打包编译结果
      # 将编译后的 tcc.exe 上传为 artifact
      - name: Upload TCC artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcc-windows-amd64 # Artifact 的名称
          path: ./tcc.exe         # 需要上传的文件路径 (Windows 下通常是 .exe 后缀)
          if-no-files-found: error # 如果找不到 tcc.exe 文件则报错
